[project]
name = "nico-analyzer"
version = "0.1.0"
description = "ニコニコ動画 年次統計ツール"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "matplotlib>=3.10.0",
    "matplotlib-fontja>=1.1.0",
    "mecab-python3>=1.0.0",
    "nicovideo-api-client>=3.0.1",
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "pillow>=12.0.0",
    "requests>=2.32.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.0",
    "unidic-lite>=1.0.0",
    "wordcloud>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["common_utils.py"]
